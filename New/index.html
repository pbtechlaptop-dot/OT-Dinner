<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f5f8b" />
  <title>加班 Order 飯系統 - New</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-app-id="main">
  <main class="shell">
    <header class="hero">
      <div>
        <h1 id="appTitle">加班 Order 飯系統 - New</h1>
        <p id="dateText">日期：--</p>
        <p id="restaurantText">今日餐廳：未設定</p>
      </div>
      <div class="actions">
        <button id="langTc" class="btn btn-ghost" type="button">繁中</button>
        <button id="langSc" class="btn btn-ghost" type="button">简中</button>
        <button id="langEn" class="btn btn-ghost" type="button">EN</button>
        <a id="mainLink" class="btn btn-ghost" href="/">原本前台</a>
      </div>
    </header>

    <section class="card">
      <h2 id="staffTitle">1) 同事資料</h2>
      <div class="grid">
        <label>
          <span id="deptLabel">部門</span>
          <select id="deptSelect" required></select>
        </label>
        <label>
          <span id="nameLabel">同事</span>
          <select id="nameSelect" required></select>
        </label>
        <label class="wide">
          <span id="drinkLabel">飲品</span>
          <select id="drinkSelect"></select>
        </label>
      </div>
    </section>

    <section class="card">
      <h2 id="foodTitle">2) 選擇食物</h2>
      <div class="status-row">
        <div class="stat">
          <span id="limitLabel">上限</span>
          <strong id="limitText">$0.00</strong>
        </div>
        <div class="stat">
          <span id="kindsLabel">已選款式</span>
          <strong id="selectedKindsText">0</strong>
        </div>
        <div class="stat">
          <span id="qtyLabel">總數量</span>
          <strong id="selectedQtyText">0</strong>
        </div>
        <div class="stat ok" id="balanceBox">
          <span id="balanceLabel">剩餘 / 超出</span>
          <strong id="balanceText">$0.00</strong>
        </div>
      </div>
      <div id="budgetNotice" class="notice ok">可在上限內選一份或多份食物；超過上限不能下單。</div>
      <div class="menu-layout" style="margin-top:12px;">
        <div>
          <div class="filters">
            <select id="categorySelect"></select>
          </div>
          <div id="foodList" class="food-list"></div>
        </div>
        <aside class="card selection">
          <h3 id="selectedFoodTitle">已選食物</h3>
          <div id="selectionList" class="selection-list">
            <p class="hint">未選食物。</p>
          </div>
          <label>
            <span id="addonLabel">加配 / 備註</span>
            <textarea id="addonInput" rows="3" placeholder="例如：走蔥、加飯"></textarea>
          </label>
          <button id="submitBtn" class="btn" type="button" style="width:100%; margin-top:10px;">提交訂單</button>
        </aside>
      </div>
    </section>

    <section class="card">
      <h2 id="ordersTitle">3) 今日訂單</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th id="ordersDeptTh">部門</th>
              <th id="ordersNameTh">同事</th>
              <th id="ordersFoodTh">餐點</th>
              <th id="ordersAddonTh">加配</th>
              <th id="ordersDrinkTh">飲品</th>
              <th id="ordersPriceTh">價錢</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
          <tfoot>
            <tr>
              <td colspan="6"><strong id="totalLabel">總計</strong></td>
              <td><strong id="ordersTotal">$0.00</strong></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="summary-grid">
        <div class="summary-box">
          <h3 id="drinkSummaryTitle">飲品總計</h3>
          <div id="drinkSummary" class="summary-text"></div>
        </div>
        <div class="summary-box">
          <h3 id="foodSummaryTitle">餐點總計</h3>
          <div id="foodSummary" class="summary-text"></div>
        </div>
        <div class="summary-box">
          <h3 id="foodSummaryByDeptTitle">餐點總計（按部門）</h3>
          <div id="foodSummaryByDept" class="summary-text"></div>
        </div>
      </div>
    </section>
  </main>
  <div id="confirmModal" class="modal hidden">
    <div class="modal-card">
      <h3 id="confirmTitle">確認變更訂單</h3>
      <p id="confirmMessage"></p>
      <div class="modal-actions">
        <button id="cancelChangeBtn" class="btn btn-light" type="button">取消</button>
        <button id="confirmChangeBtn" class="btn" type="button">確定變更</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
