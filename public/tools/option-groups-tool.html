<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Option Groups Builder</title>
    <style>
      :root { color-scheme: light; }
      body { font-family: Arial, sans-serif; margin: 24px; color: #0f172a; }
      h1 { font-size: 20px; margin: 0 0 12px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
      label { display: block; font-size: 12px; color: #475569; margin-bottom: 4px; }
      input, textarea, button { font: inherit; }
      input, textarea { border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; }
      textarea { width: 100%; min-height: 180px; }
      button { background: #0f172a; color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
      button.secondary { background: #e2e8f0; color: #0f172a; }
      .panel { border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; }
      .hint { font-size: 12px; color: #64748b; margin-top: 6px; }
      .flex-1 { flex: 1 1 220px; }
    </style>
  </head>
  <body>
    <h1>Option Groups Builder</h1>
    <div class="panel">
      <h2 style="margin: 0 0 8px; font-size: 14px;">Group A (Main)</h2>
      <div class="row">
        <div class="flex-1">
          <label for="labelA">Label</label>
          <input id="labelA" type="text" placeholder="e.g. Double combo (pick 2)" />
        </div>
        <div class="flex-1">
          <label for="minA">Min</label>
          <input id="minA" type="number" min="0" step="1" placeholder="e.g. 2" />
        </div>
        <div class="flex-1">
          <label for="maxA">Max</label>
          <input id="maxA" type="number" min="0" step="1" placeholder="e.g. 2" />
        </div>
        <div class="flex-1">
          <label for="idA">Id (optional)</label>
          <input id="idA" type="text" placeholder="e.g. pair" />
        </div>
      </div>
      <label for="inputA">Choices per row (one row per menu item, comma-separated)</label>
      <textarea id="inputA" placeholder="Example:\nChicken, Pork, Beef\nChicken, Duck, Char siu"></textarea>

      <h2 style="margin: 14px 0 8px; font-size: 14px;">Group B (Optional)</h2>
      <div class="row">
        <label class="flex-1" style="display:flex; align-items:center; gap:8px; font-size:12px;">
          <input id="enableB" type="checkbox" />
          Enable Group B
        </label>
        <label class="flex-1" style="display:flex; align-items:center; gap:8px; font-size:12px;">
          <input id="sameB" type="checkbox" checked />
          Same choices for all rows
        </label>
      </div>
      <div class="row">
        <div class="flex-1">
          <label for="labelB">Label</label>
          <input id="labelB" type="text" placeholder="e.g. Base (pick 1)" />
        </div>
        <div class="flex-1">
          <label for="minB">Min</label>
          <input id="minB" type="number" min="0" step="1" placeholder="e.g. 1" />
        </div>
        <div class="flex-1">
          <label for="maxB">Max</label>
          <input id="maxB" type="number" min="0" step="1" placeholder="e.g. 1" />
        </div>
        <div class="flex-1">
          <label for="idB">Id (optional)</label>
          <input id="idB" type="text" placeholder="e.g. base" />
        </div>
      </div>
      <label for="inputB">Choices for Group B (comma-separated)</label>
      <textarea id="inputB" placeholder="Example:\nRice, Noodle\nUse +price: Lo Mein+2 or Lo Mein(+2)"></textarea>
      <div class="row" style="margin-top: 12px;">
        <button id="build">Build JSON</button>
        <button id="copy" class="secondary">Copy Output</button>
      </div>
      <label for="output">Output (paste into Excel column Option Groups)</label>
      <textarea id="output" readonly></textarea>
      <div class="hint">Each output line matches the same input line order.</div>
    </div>

    <script>
      const $ = id => document.getElementById(id);
      const buildBtn = $('build');
      const copyBtn = $('copy');

      function parseChoice(value) {
        const raw = String(value || '').trim();
        if (!raw) return null;
        const match = raw.match(/^(.*?)(?:\s*\(\s*(?:\+|加)?\s*\$?\s*([0-9]+(?:\.[0-9]+)?)\s*\)\s*|\s*(?:\+|加)\s*\$?\s*([0-9]+(?:\.[0-9]+)?)\s*)$/);
        if (match) {
          const label = match[1].trim();
          const price = Number(match[2] || match[3]);
          if (label && Number.isFinite(price) && price > 0) {
            return { label, price };
          }
          return label || null;
        }
        return raw;
      }

      function parseChoices(line) {
        return line.split(',').map(parseChoice).filter(Boolean);
      }

      function buildGroup(choices, index, meta) {
        if (!choices.length) return null;
        const group = {
          id: meta.id || String(index + 1),
          label: meta.label || '',
          choices
        };
        if (Number.isFinite(meta.min)) group.min = meta.min;
        if (Number.isFinite(meta.max)) group.max = meta.max;
        return group;
      }

      buildBtn.onclick = () => {
        const labelA = $('labelA').value.trim();
        const idA = $('idA').value.trim();
        const minAVal = $('minA').value;
        const maxAVal = $('maxA').value;
        const minA = minAVal === '' ? undefined : Number(minAVal);
        const maxA = maxAVal === '' ? undefined : Number(maxAVal);
        const linesA = $('inputA').value.split(/\r?\n/);

        const enableB = $('enableB').checked;
        const sameB = $('sameB').checked;
        const labelB = $('labelB').value.trim();
        const idB = $('idB').value.trim();
        const minBVal = $('minB').value;
        const maxBVal = $('maxB').value;
        const minB = minBVal === '' ? undefined : Number(minBVal);
        const maxB = maxBVal === '' ? undefined : Number(maxBVal);
        const linesB = $('inputB').value.split(/\r?\n/);
        const sharedBChoices = sameB ? parseChoices(linesB[0] || '') : [];

        const out = linesA.map((lineA, i) => {
          const groups = [];
          const choicesA = parseChoices(lineA);
          const groupA = buildGroup(choicesA, i, { label: labelA, id: idA, min: minA, max: maxA });
          if (groupA) groups.push(groupA);

          if (enableB) {
            const choicesB = sameB ? sharedBChoices : parseChoices(linesB[i] || '');
            const groupB = buildGroup(choicesB, i, { label: labelB, id: idB, min: minB, max: maxB });
            if (groupB) groups.push(groupB);
          }

          return groups.length ? JSON.stringify(groups) : '';
        });
        $('output').value = out.join('\n');
      };

      copyBtn.onclick = async () => {
        const text = $('output').value;
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          $('output').select();
          document.execCommand('copy');
        }
      };
    </script>
  </body>
</html>
