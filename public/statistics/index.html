<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>訂餐統計</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/statistics/styles.css?v=20261121-2">
</head>
<body>
  <header class="topbar">
    <div class="header-inner">
      <div class="identity"><img src="/icons/icon-v3-192.png" alt="" width="32" height="32"><h1>訂餐統計</h1></div>
      <a href="/new/">返回訂餐頁 <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main>
    <form id="filters" class="filters">
      <div class="date-fields">
        <label for="from">開始日期<input id="from" name="from" type="date" required></label>
        <span class="date-separator" aria-hidden="true">—</span>
        <label for="to">結束日期<input id="to" name="to" type="date" required></label>
      </div>
      <label for="app">訂餐頁面<select id="app" name="app"><option value="all">全部頁面</option><option value="main">主頁</option><option value="lady-ruby">Lady Ruby</option></select></label>
      <button class="primary" id="query" type="submit">查詢</button>
      <div class="filter-second-row">
        <div class="presets" aria-label="日期範圍">
          <button type="button" data-preset="today">今日</button>
          <button type="button" data-preset="week">本週</button>
          <button type="button" data-preset="month">本月</button>
          <button type="button" data-preset="previous">上月</button>
        </div>
        <label class="check"><input id="includeTests" type="checkbox">包含測試訂單</label>
      </div>
    </form>

    <div class="report-heading"><h2 id="rangeLabel">本月統計</h2><p id="status" role="status" aria-live="polite">載入中…</p></div>
    <div id="error" role="alert" hidden></div>
    <div id="report" aria-busy="true">
      <section class="metrics" aria-label="統計總覽">
        <div><span>訂單總數</span><strong id="orderCount">—</strong><small>張</small></div>
        <div><span>餐點總數</span><strong id="servingCount">—</strong><small>份</small></div>
        <div><span>可統計餐廳</span><strong id="restaurantCount">—</strong><small>間</small></div>
        <div><span>餐廳未能確認</span><strong id="unknownCount">—</strong><small>張</small></div>
      </section>
      <p id="coverage" class="coverage"></p>

      <section class="restaurant-section">
        <div class="section-heading"><h2>最常選用餐廳頭三位</h2><span>按選用日數</span></div>
        <div id="restaurants" class="rank-grid"><p class="empty">載入中…</p></div>
      </section>

      <section class="dishes-section">
        <div class="section-heading dishes-heading">
          <div><h2>熱門菜式</h2><span id="dishCount">按餐點份數</span></div>
          <div class="table-actions">
            <label class="search-label"><span class="sr-only">搜尋菜式或餐廳</span><input id="search" type="search" placeholder="搜尋菜式或餐廳"></label>
            <button id="export" type="button" disabled>匯出 CSV</button>
          </div>
        </div>
        <div class="table-scroll" tabindex="0" role="region" aria-label="熱門菜式排名">
          <table>
            <thead><tr><th class="rank-column" scope="col">排名</th><th scope="col">菜式</th><th scope="col">餐廳</th><th class="numeric" scope="col">份數</th><th class="numeric" scope="col">訂單數</th></tr></thead>
            <tbody id="dishes"><tr><td colspan="5" class="empty">載入中…</td></tr></tbody>
          </table>
        </div>
        <nav id="pagination" class="pagination" aria-label="菜式分頁">
          <span id="pageLabel"></span>
          <div><button id="previous" type="button" aria-label="上一頁" title="上一頁">←</button><button id="next" type="button" aria-label="下一頁" title="下一頁">→</button></div>
        </nav>
      </section>
      <p class="report-note">餐廳同日只計一次，合併頁面時亦不重複計算。日期包含首尾兩日。餐點份數與訂餐人數不同。</p>
    </div>
  </main>
  <script src="/statistics/app.js?v=20261121-3"></script>
</body>
</html>
